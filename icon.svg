<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4682B4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#skyGradient)" stroke="#4682B4" stroke-width="2"/>
  
  <!-- Sun -->
  <circle cx="35" cy="35" r="8" fill="#FFD700" />
  
  <!-- Sun rays -->
  <path d="M35 20 L35 15" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <path d="M50 35 L55 35" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <path d="M35 50 L35 55" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <path d="M20 35 L15 35" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <path d="M45.7 24.3 L49.0 21.0" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <path d="M45.7 45.7 L49.0 49.0" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <path d="M24.3 45.7 L21.0 49.0" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <path d="M24.3 24.3 L21.0 21.0" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Cloud -->
  <ellipse cx="60" cy="55" rx="15" ry="10" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1"/>
  <ellipse cx="50" cy="60" rx="12" ry="8" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1"/>
  <ellipse cx="70" cy="60" rx="10" ry="6" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1"/>
  
  <!-- Rain drops -->
  <ellipse cx="52" cy="75" rx="1" ry="3" fill="#4682B4"/>
  <ellipse cx="58" cy="78" rx="1" ry="3" fill="#4682B4"/>
  <ellipse cx="64" cy="75" rx="1" ry="3" fill="#4682B4"/>
</svg>